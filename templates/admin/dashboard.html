{% extends "base.html" %}
{% block title %}後台儀表板 - 樹木監測系統{% endblock %}

{% block extra_css %}
<style>
    .admin-header {
        background: #1b5e20; color: white;
        padding: 16px 32px; display: flex;
        justify-content: space-between; align-items: center;
    }
    .admin-header h2 { margin: 0; font-size: 1.3em; }
    .btn-logout {
        background: rgba(255,255,255,0.2); color: white;
        border: 1px solid rgba(255,255,255,0.5); padding: 8px 18px;
        border-radius: 6px; cursor: pointer; font-size: 0.9em;
        transition: background 0.2s;
    }
    .btn-logout:hover { background: rgba(255,255,255,0.35); }

    .admin-body { padding: 24px 32px; }
    .section-title { color: #1b5e20; margin-bottom: 16px; font-size: 1.1em; }

    /* 狀態篩選 */
    .filter-bar { margin-bottom: 16px; display: flex; gap: 8px; }
    .filter-btn {
        padding: 6px 16px; border-radius: 20px; border: 1px solid #ccc;
        cursor: pointer; font-size: 0.85em; background: white; color: #555;
    }
    .filter-btn.active { background: #1b5e20; color: white; border-color: #1b5e20; }

    /* 表格 */
    .table-wrap { overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; font-size: 0.9em; }
    th { background: #e8f5e9; color: #1b5e20; padding: 10px 12px; text-align: left; }
    td { padding: 10px 12px; border-bottom: 1px solid #f0f0f0; vertical-align: middle; }
    tr:hover td { background: #f9f9f9; }
    tr.row-pending  { border-left: 4px solid #ff9800; }
    tr.row-confirmed { border-left: 4px solid #4caf50; }

    /* 狀態標籤 */
    .badge {
        display: inline-block; padding: 3px 10px; border-radius: 12px;
        font-size: 0.8em; font-weight: bold;
    }
    .badge-pending   { background: #fff3e0; color: #e65100; }
    .badge-confirmed { background: #e8f5e9; color: #1b5e20; }

    /* 操作按鈕 */
    .btn-confirm {
        background: #4caf50; color: white; border: none;
        padding: 5px 12px; border-radius: 5px; cursor: pointer; font-size: 0.85em;
    }
    .btn-confirm:hover { background: #388e3c; }
    .btn-delete {
        background: #ef5350; color: white; border: none;
        padding: 5px 12px; border-radius: 5px; cursor: pointer; font-size: 0.85em;
        margin-left: 6px;
    }
    .btn-delete:hover { background: #c62828; }

    #status-bar { color: #888; font-size: 0.85em; margin-bottom: 12px; min-height: 1.2em; }
    .empty-msg { text-align: center; padding: 40px; color: #aaa; }
</style>
{% endblock %}

{% block content %}
<div class="admin-header">
    <h2>後台管理儀表板</h2>
    <button class="btn-logout" id="logout-btn">登出</button>
</div>

<div class="admin-body">
    <p class="section-title">樹木辨識紀錄管理</p>
    <div class="filter-bar">
        <button class="filter-btn active" data-filter="all">全部</button>
        <button class="filter-btn" data-filter="pending">待審核</button>
        <button class="filter-btn" data-filter="confirmed">已發布</button>
    </div>
    <div id="status-bar">載入中…</div>
    <div class="table-wrap">
        <table>
            <thead>
                <tr>
                    <th>ID</th>
                    <th>樹種</th>
                    <th>樹徑 (cm)</th>
                    <th>固碳量 (kg)</th>
                    <th>狀態</th>
                    <th>量測時間</th>
                    <th>操作</th>
                </tr>
            </thead>
            <tbody id="trees-body">
                <tr><td colspan="7" class="empty-msg">載入中…</td></tr>
            </tbody>
        </table>
    </div>
</div>

<script src="/static/js/admin.js"></script>
{% endblock %}
