<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{% block title %}樹木監測網站{% endblock %}</title>
<link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
{% block extra_head %}{% endblock %}
</head>
<body>

<header class="navbar">
    <div class="nav-left">
        <a href="{{ url_for('pages.index') }}" class="site-title">樹木監測網站</a>
    </div>
    <nav class="nav-center">
        <a href="{{ url_for('pages.index') }}" class="nav-item">首頁</a>
        <span class="nav-item">數位地圖</span>
        {# 張恆輔 8/17修改：系統管理改為連結，導向檢視資料表頁面 #}
        <a href="{{ url_for('admin.dashboard') }}" class="nav-item">系統管理 ▾</a>
        <span class="nav-item">關於我們</span>
    </nav>
    <div class="nav-right">
        {% if session.admin_id %}
            <span class="nav-item">{{ session.username }}</span>
            <button type="button" id="logout-btn" class="nav-link logout-btn">登出</button>
        {% else %}
            <a href="{{ url_for('admin.login_page') }}" class="nav-link">後台登入</a>
        {% endif %}
    </div>
</header>

<main>
{% block content %}{% endblock %}
</main>

<script src="{{ url_for('static', filename='js/nav.js') }}" defer></script>
{% block extra_scripts %}{% endblock %}
</body>
</html>
