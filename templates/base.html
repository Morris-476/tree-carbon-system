<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{% block title %}樹木監測網站{% endblock %}</title>
<link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
{% block extra_head %}{% endblock %}
</head>
<body>

<header class="navbar">
    <div class="nav-left">
        <a href="{{ url_for('pages.index') }}" class="site-title">樹木碳匯監測系統</a>
    </div>
    <nav class="nav-center">
        <a href="{{ url_for('pages.index') }}" class="nav-item">首頁</a>
        <a href="{{ url_for('pages.map_page') }}" class="nav-item">數位地圖</a>
        <div class="nav-item nav-dropdown">
            <button type="button" class="nav-dropdown-toggle">系統管理 ▾</button>
            <div class="nav-dropdown-menu" hidden>
                <a href="{{ url_for('admin.dashboard') }}">檢視資料表</a>
                <a href="{{ url_for('admin.manage_page') }}">數據管理與維護</a>
            </div>
        </div>
        <a href="{{ url_for('pages.measure') }}" class="nav-item">簡易固碳繪測</a>
    </nav>
    <div class="nav-right">
        {% if session.admin_id %}
            <span class="nav-item">{{ session.username }}</span>
            <button type="button" id="logout-btn" class="nav-link logout-btn">登出</button>
        {% else %}
            <a href="{{ url_for('admin.login_page') }}" class="nav-link">後台登入</a>
        {% endif %}
    </div>
</header>

<main>
{% block content %}{% endblock %}
</main>

<footer class="site-footer">
    <p>@ 2026 淡江大學樹木碳匯監測系統</p>
</footer>

<script src="{{ url_for('static', filename='js/nav.js') }}" defer></script>
{% block extra_scripts %}{% endblock %}
</body>
</html>
